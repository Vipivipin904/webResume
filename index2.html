<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="stylesheet" href="vipin.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="home" class="fade-in">
        <h1>Welcome to My Website</h1>
        <p>This is a simple example of a website with HTML, CSS, and JavaScript.</p>
    </section>

    <section id="about" class="fade-in">
        <h2>About Us</h2>
        <p>We are a team of passionate developers building great websites and applications.</p>
    </section>

    <section id="contact" class="fade-in">
        <h2>Contact Us</h2>
        <form id="contactForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>
            
            <button type="submit">Send Message</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2024 My Website</p>
    </footer>

    <script src="vipin.js"></script>
</body>
</html>
